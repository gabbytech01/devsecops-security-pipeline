name: Infrastructure as Code (IaC) Security Gate

on:
  workflow_call:

jobs:
  checkov-iac-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'all'
